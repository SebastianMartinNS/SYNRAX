[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synrax"
version = "0.1.0"
description = "ArchGraph — formal knowledge graph layer for CodeDNA-annotated codebases"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ab Es" }]
keywords = ["codedna", "archgraph", "rdf", "owl", "shacl", "sparql", "knowledge-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "rdflib>=7.0",
    "owlrl>=6.0",
    "pyshacl>=0.25",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
oxigraph = ["pyoxigraph>=0.3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pyoxigraph>=0.3",
]

[project.scripts]
codedna-export = "synrax.cli.main:cli"

[tool.setuptools.packages.find]
include = ["synrax*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
